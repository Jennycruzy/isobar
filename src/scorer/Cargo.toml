[package]
name = "isobar-scorer"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Deterministic Telegraph scoring module and local evaluation harness"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Selects the embedded, converted MiniLM-L6-v2 INT8 runtime.
real_weights = []
# Compatibility switch for the upstream salience module's optional transformer
# branch. It also enables the embedded runtime; WEATHER_CHECK keeps this path
# off and uses the bounded lexical/fact implementation.
minilm = ["real_weights"]
native-harness = []

[dependencies]
libm = "0.2.16"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[[bin]]
name = "isobar-scorer-harness"
path = "src/bin/harness.rs"
required-features = ["native-harness"]

[[bin]]
name = "isobar-embed-dump"
path = "src/bin/embed_dump.rs"
required-features = ["native-harness", "real_weights"]

[[bin]]
name = "isobar-score-case"
path = "src/bin/score_case.rs"
required-features = ["native-harness", "real_weights"]
